version: 2
updates:
  # The npm ecosystem block is gone with the toolchain: this project has no
  # package.json, no lockfile, and no JavaScript dependencies to update.
  - package-ecosystem: cargo
    directory: "/"
    # Integration lands on develop first; main only moves through a release PR.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
